name: Extract MySolat Source

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/extract-trigger.txt"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract both source ZIPs
        run: |
          rm -rf app-source app-source-original
          mkdir -p app-source app-source-original
          unzip -q "waktu-solat-pwa-fixed.zip" -d app-source
          unzip -q "waktusolat pwa.zip" -d app-source-original
          echo "=== fixed ==="
          find app-source -type f | sort
          echo "=== original ==="
          find app-source-original -type f | sort

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source app-source-original
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Extract both MySolat source archives"
            git push
          fi
