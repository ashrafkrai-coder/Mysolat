name: Extract MySolat Source

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/extract-trigger.txt"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          rm -rf app-source
          mkdir -p app-source
          unzip -q "waktu-solat-pwa-fixed.zip" -d app-source
          find app-source -type f | sort | head -200

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Extract MySolat source for maintenance"
            git push
          fi
